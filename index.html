<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="多语言问卷截图查看页面">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231f2937'/%3E%3Cpath d='M18 20h28M22 32h20M26 44h12' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>多语言问卷</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;
      --text: #172033;
      --muted: #748096;
      --border: #dce2ec;
      --active: #1f2937;
      --active-text: #ffffff;
      --focus: #8bb8ff;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(129, 166, 255, .13), transparent 32rem),
        var(--background);
    }

    button { font: inherit; }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(220, 226, 236, .9);
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 28px rgba(30, 42, 65, .06);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(1440px, 100%);
      margin: 0 auto;
    }

    .language-selector {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-soft);
    }

    .language-button {
      position: relative;
      min-width: 104px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #4c586d;
      background: transparent;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .language-button:hover:not(.is-selected) {
      color: var(--text);
      background: rgba(255, 255, 255, .82);
    }

    .language-button:active { transform: scale(.98); }

    .language-button:focus-visible,
    .page-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .language-button.is-selected {
      padding-left: 34px;
      color: var(--active-text);
      background: var(--active);
      box-shadow: 0 8px 20px rgba(31, 41, 55, .2);
    }

    .language-button.is-selected::before {
      content: "✓";
      position: absolute;
      left: 15px;
      top: 50%;
      font-size: 13px;
      transform: translateY(-50%);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 430px) repeat(3, minmax(280px, 1fr));
      gap: 22px;
      width: 100%;
      min-height: calc(100vh - 100px);
      margin: 0 0 32px;
      padding-right: 20px;
    }

    .screenshot-panel {
      position: sticky;
      top: 98px;
      align-self: start;
      overflow: hidden;
      border: 1px solid var(--border);
      border-left: 0;
      border-radius: 0 20px 20px 0;
      background: var(--surface);
      box-shadow: 0 14px 38px rgba(30, 42, 65, .09);
    }

    .screenshot-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      min-height: 92px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
    }

    .page-kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
    }

    .language-label {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      color: #465267;
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .image-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      height: calc(100vh - 330px);
      max-height: 720px;
      padding: 18px;
      overflow: hidden;
      background:
        linear-gradient(45deg, rgba(255, 255, 255, .025) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .025) 75%),
        #202733;
      background-size: 22px 22px;
    }

    .questionnaire-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 5px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, .28);
    }

    .questionnaire-image.is-loading { opacity: .35; }

    .page-navigation {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(30, 42, 65, .06);
    }

    .page-button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--surface);
      font-weight: 750;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }

    .page-button:last-child { justify-self: end; }
    .page-button:hover:not(:disabled) { border-color: #aeb8c8; background: var(--surface-soft); }
    .page-button:disabled { color: #aab2c0; cursor: not-allowed; }

    .page-counter {
      min-width: 70px;
      color: var(--muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-align: center;
    }

    .content-area {
      align-self: start;
      padding: 28px;
      border: 1px solid rgba(220, 226, 236, .72);
      border-radius: 20px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 14px 38px rgba(30, 42, 65, .06);
    }

    .ai-panel {
      min-height: min(72vh, 720px);
    }

    .content-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .baseline-heading {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .baseline-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(27px, 2.4vw, 36px);
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      letter-spacing: .06em;
    }

    .content-kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .content-title {
      margin: 0;
      font-size: clamp(23px, 3vw, 32px);
      line-height: 1.25;
    }

    .readonly-badge {
      position: absolute;
      top: 2px;
      right: 0;
      padding: 7px 11px;
      border: 1px solid #cfd8e5;
      border-radius: 999px;
      color: #5c687d;
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .editable-badge {
      color: #17613b;
      border-color: #b9dfca;
      background: #edf9f2;
    }

    .content-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .text-count {
      flex: 0 0 auto;
      color: #47536a;
      font-weight: 800;
    }

    .chinese-text-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .chinese-text-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px 15px;
      border: 1px solid #e1e6ee;
      border-radius: 13px;
      background: var(--surface);
    }

    .text-index {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      color: #5c687d;
      background: var(--surface-soft);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
    }

    .text-value {
      padding-top: 4px;
      font-size: 16px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .dynamic-badge {
      margin-top: 5px;
      padding: 3px 7px;
      border-radius: 7px;
      color: #7a5b16;
      background: #fff4d6;
      font-size: 11px;
      font-weight: 800;
    }

    .text-empty {
      padding: 34px;
      border: 1px dashed #c6cfdd;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    .review-text-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .review-text-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid #e1e6ee;
      border-radius: 13px;
      background: var(--surface);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .review-text-item:focus-within {
      border-color: #9ab8e7;
      box-shadow: 0 0 0 3px rgba(139, 184, 255, .2);
    }

    .review-textarea {
      width: 100%;
      min-height: 48px;
      padding: 7px 8px;
      overflow: hidden;
      resize: vertical;
      border: 0;
      border-radius: 8px;
      outline: 0;
      color: var(--text);
      background: #f8fafc;
      font: inherit;
      font-size: 15px;
      line-height: 1.55;
    }

    .review-item-meta {
      grid-column: 2;
      display: flex;
      align-items: center;
      min-height: 18px;
      margin-top: -6px;
    }

    .review-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .action-button {
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--surface);
      font-weight: 800;
      cursor: pointer;
    }

    .action-button:hover:not(:disabled) { border-color: #aeb8c8; background: var(--surface-soft); }
    .action-button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .action-button:disabled { color: #aab2c0; cursor: not-allowed; }

    .action-button.primary {
      color: #fff;
      border-color: var(--active);
      background: var(--active);
    }

    .action-button.export {
      grid-column: 1 / -1;
      color: #fff;
      border-color: #17613b;
      background: #217a4b;
    }

    .action-button.primary:disabled,
    .action-button.export:disabled {
      color: #aab2c0;
      border-color: var(--border);
      background: #f3f5f8;
    }

    .review-status {
      min-height: 20px;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .export-hint {
      margin: 12px 2px 0;
      color: #8a6470;
      font-size: 12px;
      line-height: 1.55;
    }

    .selection-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1360px) {
      .workspace { grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); }
    }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; padding-right: 0; }
      .screenshot-panel { position: static; width: min(100%, 500px); margin: 0; }
      .image-stage { height: min(68vh, 720px); min-height: 460px; }
      .content-area { min-height: 420px; margin: 0 12px 20px; padding: 22px; }
    }

    @media (max-width: 560px) {
      .page-header { padding: 12px; }
      .language-selector { display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; }
      .language-button { min-width: 0; width: 100%; }
      .workspace { width: 100%; margin-top: 0; }
      .screenshot-heading { padding: 17px; }
      .image-stage { height: 62vh; min-height: 400px; padding: 12px; }
      .page-navigation { gap: 8px; padding: 12px; }
      .page-button { padding-inline: 10px; }
      .content-area { margin-inline: 10px; padding: 18px; }
      .content-heading { gap: 10px; }
      .baseline-title { font-size: 25px; }
      .chinese-text-item { grid-template-columns: 34px minmax(0, 1fr); }
      .review-text-item { grid-template-columns: 34px minmax(0, 1fr); }
      .dynamic-badge { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <div class="language-selector" role="radiogroup" aria-label="选择页面语言">
        <button class="language-button is-selected" type="button" role="radio" aria-checked="true" tabindex="0" data-language="zh">中文</button>
        <button class="language-button" type="button" role="radio" aria-checked="false" tabindex="-1" data-language="en">英文</button>
        <button class="language-button" type="button" role="radio" aria-checked="false" tabindex="-1" data-language="th">泰语</button>
        <button class="language-button" type="button" role="radio" aria-checked="false" tabindex="-1" data-language="ms">马来语</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <aside class="screenshot-panel" aria-label="问卷截图浏览器">
      <div class="screenshot-heading">
        <div>
          <p id="pageKicker" class="page-kicker">问卷页面 01</p>
          <h1 id="pageTitle" class="page-title">问卷介绍</h1>
        </div>
        <span id="languageLabel" class="language-label">中文</span>
      </div>

      <div id="imageStage" class="image-stage">
        <img id="questionnaireImage" class="questionnaire-image" src="assets/screenshots/zh/01.png" alt="中文问卷第 1 页：问卷介绍" draggable="false">
      </div>

      <nav class="page-navigation" aria-label="问卷截图翻页">
        <button id="previousPage" class="page-button" type="button" disabled>← 上一页</button>
        <span id="pageCounter" class="page-counter">01 / 20</span>
        <button id="nextPage" class="page-button" type="button">下一页 →</button>
      </nav>
    </aside>

    <section id="pageContent" class="content-area" aria-labelledby="chineseTextTitle">
      <div class="baseline-heading">
        <h2 class="baseline-title">中文基准</h2>
        <span class="readonly-badge">只读</span>
      </div>
      <div class="content-heading">
        <div>
          <p id="chineseTextKicker" class="content-kicker">问卷页面 01</p>
          <h3 id="chineseTextTitle" class="content-title">问卷介绍</h3>
        </div>
      </div>
      <div class="content-summary">
        <span>当前页面提取到的全部中文可见内容</span>
        <span id="chineseTextCount" class="text-count">0 条</span>
      </div>
      <ol id="chineseTextList" class="chinese-text-list" aria-live="polite"></ol>
    </section>

    <section class="content-area ai-panel" aria-labelledby="aiTranslationTitle">
      <div class="baseline-heading">
        <h2 id="aiTranslationTitle" class="baseline-title">AI翻译</h2>
      </div>
    </section>

    <section class="content-area review-panel" aria-labelledby="manualReviewTitle">
      <div class="baseline-heading">
        <h2 id="manualReviewTitle" class="baseline-title">人工核对</h2>
        <span class="readonly-badge editable-badge">可编辑</span>
      </div>
      <div class="content-heading">
        <div>
          <p id="reviewTextKicker" class="content-kicker">问卷页面 01</p>
          <h3 id="reviewTextTitle" class="content-title">问卷介绍</h3>
        </div>
      </div>
      <div class="content-summary">
        <span>修改并保存当前页面的中文文案</span>
        <span id="reviewTextCount" class="text-count">0 条</span>
      </div>
      <ol id="reviewTextList" class="review-text-list"></ol>
      <div class="review-actions">
        <button id="resetCurrentReview" class="action-button" type="button">重置当前页</button>
        <button id="saveCurrentReview" class="action-button primary" type="button">保存当前页</button>
        <button id="exportReviewedTexts" class="action-button export" type="button">导出修改后的文案</button>
      </div>
      <p class="export-hint">导出文件会保存到浏览器下载目录，不会自动覆盖项目中的原始数据文件。</p>
      <p id="reviewStatus" class="review-status" role="status" aria-live="polite">当前页与中文基准一致</p>
    </section>
  </main>

  <p id="selectionStatus" class="selection-status" role="status" aria-live="polite">当前目标语言：中文；截图固定为中文，第 1 页，问卷介绍</p>

  <script src="assets/data/zh-questionnaire-text.js"></script>
  <script>
    (function () {
      'use strict'

      const LANGUAGE_STORAGE_KEY = 'multilingual-page:language'
      const PAGE_STORAGE_KEY = 'multilingual-page:questionnaire-page'
      const REVIEW_STORAGE_KEY = 'multilingual-page:manual-review:v1'
      const SCREENSHOT_LANGUAGE = 'zh'
      const pageNames = [
        '问卷介绍', '设备情况', '性别选择', '主要目标', '锻炼部位',
        '年龄', '身高', '当前体重', '体重风险提示', '目标体重',
        '减重计划', '日常活动', '爬楼感受', '运动强度', '运动枯燥度',
        '目标实现难度', '成功案例', '平台合作', '身体状况总结', '训练计划完成'
      ]
      const languageLabels = { zh: '中文', en: '英文', th: '泰语', ms: '马来语' }
      const languageButtons = Array.from(document.querySelectorAll('.language-button'))
      const elements = {
        pageKicker: document.querySelector('#pageKicker'),
        pageTitle: document.querySelector('#pageTitle'),
        languageLabel: document.querySelector('#languageLabel'),
        image: document.querySelector('#questionnaireImage'),
        previous: document.querySelector('#previousPage'),
        next: document.querySelector('#nextPage'),
        counter: document.querySelector('#pageCounter'),
        chineseTextKicker: document.querySelector('#chineseTextKicker'),
        chineseTextTitle: document.querySelector('#chineseTextTitle'),
        chineseTextCount: document.querySelector('#chineseTextCount'),
        chineseTextList: document.querySelector('#chineseTextList'),
        reviewTextKicker: document.querySelector('#reviewTextKicker'),
        reviewTextTitle: document.querySelector('#reviewTextTitle'),
        reviewTextCount: document.querySelector('#reviewTextCount'),
        reviewTextList: document.querySelector('#reviewTextList'),
        resetReview: document.querySelector('#resetCurrentReview'),
        saveReview: document.querySelector('#saveCurrentReview'),
        exportReviews: document.querySelector('#exportReviewedTexts'),
        reviewStatus: document.querySelector('#reviewStatus'),
        status: document.querySelector('#selectionStatus')
      }

      const baselinePages = (window.QUESTIONNAIRE_TEXTS ?? []).map(page => ({
        ...page,
        items: page.items.map(item => ({ ...item }))
      }))
      const reviewDrafts = new Map()
      let savedReviews = readSavedReviews()

      let currentLanguage = readStorage(LANGUAGE_STORAGE_KEY, 'zh')
      let currentPage = Number(readStorage(PAGE_STORAGE_KEY, '0'))
      if (!Object.hasOwn(languageLabels, currentLanguage)) currentLanguage = 'zh'
      if (!Number.isInteger(currentPage) || currentPage < 0 || currentPage >= pageNames.length) currentPage = 0

      function readStorage (key, fallback) {
        try {
          return localStorage.getItem(key) ?? fallback
        } catch {
          return fallback
        }
      }

      function writeStorage (key, value) {
        try {
          localStorage.setItem(key, String(value))
        } catch {
          // The page remains usable when storage is unavailable.
        }
      }

      function readSavedReviews () {
        try {
          const value = JSON.parse(localStorage.getItem(REVIEW_STORAGE_KEY) ?? '{}')
          return value && typeof value === 'object' && !Array.isArray(value) ? value : {}
        } catch {
          return {}
        }
      }

      function persistSavedReviews () {
        try {
          if (Object.keys(savedReviews).length === 0) localStorage.removeItem(REVIEW_STORAGE_KEY)
          else localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(savedReviews))
          return true
        } catch {
          return false
        }
      }

      function arraysEqual (left, right) {
        return left.length === right.length && left.every((value, index) => value === right[index])
      }

      function savedPageValues (page) {
        const saved = savedReviews[page.name] ?? {}
        return page.items.map(item => typeof saved[item.key] === 'string' ? saved[item.key] : item.text)
      }

      function currentReviewValues (page) {
        return reviewDrafts.get(page.name) ?? savedPageValues(page)
      }

      function pageHasSavedChanges (page) {
        return !arraysEqual(savedPageValues(page), page.items.map(item => item.text))
      }

      function imagePath (language, pageIndex) {
        return `assets/screenshots/${language}/${String(pageIndex + 1).padStart(2, '0')}.png`
      }

      function updateSelectionStatus () {
        elements.status.textContent = `当前目标语言：${languageLabels[currentLanguage]}；截图固定为中文，第 ${currentPage + 1} 页，${pageNames[currentPage]}`
      }

      function renderLanguage () {
        languageButtons.forEach(button => {
          const selected = button.dataset.language === currentLanguage
          button.classList.toggle('is-selected', selected)
          button.setAttribute('aria-checked', String(selected))
          button.tabIndex = selected ? 0 : -1
        })
        document.documentElement.lang = 'zh-CN'
        elements.languageLabel.textContent = languageLabels[SCREENSHOT_LANGUAGE]
        updateSelectionStatus()
      }

      function renderPage () {
        const pageNumber = currentPage + 1
        const paddedNumber = String(pageNumber).padStart(2, '0')
        const pageName = pageNames[currentPage]
        const screenshotLanguageLabel = languageLabels[SCREENSHOT_LANGUAGE]

        elements.pageKicker.textContent = `问卷页面 ${paddedNumber}`
        elements.pageTitle.textContent = pageName
        elements.counter.textContent = `${paddedNumber} / ${pageNames.length}`
        elements.previous.disabled = currentPage === 0
        elements.next.disabled = currentPage === pageNames.length - 1
        updateSelectionStatus()

        elements.image.classList.add('is-loading')
        elements.image.alt = `${screenshotLanguageLabel}问卷第 ${pageNumber} 页：${pageName}`
        elements.image.src = imagePath(SCREENSHOT_LANGUAGE, currentPage)
        renderChineseTexts(currentPage)
        renderManualReview(currentPage)

        preloadAdjacentImage(currentPage - 1)
        preloadAdjacentImage(currentPage + 1)
      }

      function renderChineseTexts (pageIndex) {
        const page = window.QUESTIONNAIRE_TEXTS?.[pageIndex]
        const paddedNumber = String(pageIndex + 1).padStart(2, '0')
        elements.chineseTextKicker.textContent = `问卷页面 ${paddedNumber}`
        elements.chineseTextTitle.textContent = page?.label ?? pageNames[pageIndex]
        elements.chineseTextList.replaceChildren()

        if (!page || page.items.length === 0) {
          elements.chineseTextCount.textContent = '0 条'
          const empty = document.createElement('li')
          empty.className = 'text-empty'
          empty.textContent = '该页面暂时没有可展示的中文内容。'
          elements.chineseTextList.append(empty)
          return
        }

        elements.chineseTextCount.textContent = `${page.items.length} 条`
        page.items.forEach((item, index) => {
          const row = document.createElement('li')
          row.className = 'chinese-text-item'

          const number = document.createElement('span')
          number.className = 'text-index'
          number.textContent = String(index + 1).padStart(2, '0')

          const text = document.createElement('span')
          text.className = 'text-value'
          text.textContent = item.text

          row.append(number, text)
          if (item.dynamic) {
            const badge = document.createElement('span')
            badge.className = 'dynamic-badge'
            badge.textContent = '动态内容'
            row.append(badge)
          }
          elements.chineseTextList.append(row)
        })
      }

      function resizeTextarea (textarea) {
        textarea.style.height = 'auto'
        textarea.style.height = `${Math.max(48, textarea.scrollHeight)}px`
      }

      function updateReviewState (page, message) {
        const hasDraft = reviewDrafts.has(page.name)
        const hasSavedChanges = pageHasSavedChanges(page)
        elements.saveReview.disabled = !hasDraft
        elements.resetReview.disabled = !hasDraft && !hasSavedChanges

        if (message) elements.reviewStatus.textContent = message
        else if (hasDraft) elements.reviewStatus.textContent = '当前页有未保存修改'
        else if (hasSavedChanges) elements.reviewStatus.textContent = '当前页修改已保存到本浏览器'
        else elements.reviewStatus.textContent = '当前页与中文基准一致'
      }

      function updateReviewDraft (page) {
        const values = Array.from(elements.reviewTextList.querySelectorAll('.review-textarea'), textarea => textarea.value)
        const savedValues = savedPageValues(page)
        if (arraysEqual(values, savedValues)) reviewDrafts.delete(page.name)
        else reviewDrafts.set(page.name, values)
        updateReviewState(page)
      }

      function renderManualReview (pageIndex) {
        const page = baselinePages[pageIndex]
        const paddedNumber = String(pageIndex + 1).padStart(2, '0')
        elements.reviewTextKicker.textContent = `问卷页面 ${paddedNumber}`
        elements.reviewTextTitle.textContent = page?.label ?? pageNames[pageIndex]
        elements.reviewTextList.replaceChildren()

        if (!page || page.items.length === 0) {
          elements.reviewTextCount.textContent = '0 条'
          const empty = document.createElement('li')
          empty.className = 'text-empty'
          empty.textContent = '该页面暂时没有可核对的中文内容。'
          elements.reviewTextList.append(empty)
          elements.saveReview.disabled = true
          elements.resetReview.disabled = true
          elements.reviewStatus.textContent = '当前页没有可编辑内容'
          return
        }

        const values = currentReviewValues(page)
        elements.reviewTextCount.textContent = `${page.items.length} 条`
        page.items.forEach((item, index) => {
          const row = document.createElement('li')
          row.className = 'review-text-item'

          const number = document.createElement('span')
          number.className = 'text-index'
          number.textContent = String(index + 1).padStart(2, '0')

          const textarea = document.createElement('textarea')
          textarea.className = 'review-textarea'
          textarea.rows = 1
          textarea.value = values[index]
          textarea.setAttribute('aria-label', `第 ${index + 1} 条中文文案`)
          textarea.addEventListener('input', function () {
            resizeTextarea(textarea)
            updateReviewDraft(page)
          })

          row.append(number, textarea)
          if (item.dynamic) {
            const meta = document.createElement('div')
            meta.className = 'review-item-meta'
            const badge = document.createElement('span')
            badge.className = 'dynamic-badge'
            badge.textContent = '动态内容'
            meta.append(badge)
            row.append(meta)
          }
          elements.reviewTextList.append(row)
          resizeTextarea(textarea)
        })
        updateReviewState(page)
      }

      function saveCurrentReview () {
        const page = baselinePages[currentPage]
        if (!page) return
        const values = Array.from(elements.reviewTextList.querySelectorAll('.review-textarea'), textarea => textarea.value)
        const changes = {}
        page.items.forEach((item, index) => {
          if (values[index] !== item.text) changes[item.key] = values[index]
        })

        if (Object.keys(changes).length === 0) delete savedReviews[page.name]
        else savedReviews[page.name] = changes
        reviewDrafts.delete(page.name)

        const persisted = persistSavedReviews()
        renderManualReview(currentPage)
        updateReviewState(page, persisted ? '当前页修改已保存' : '浏览器存储不可用，修改仅在本次打开期间有效')
      }

      function resetCurrentReview () {
        const page = baselinePages[currentPage]
        if (!page) return
        delete savedReviews[page.name]
        reviewDrafts.delete(page.name)
        const persisted = persistSavedReviews()
        renderManualReview(currentPage)
        updateReviewState(page, persisted ? '当前页已重置为中文基准' : '当前页已在本次打开期间重置')
      }

      function createReviewedExport () {
        return baselinePages.map(page => {
          const saved = savedReviews[page.name] ?? {}
          return {
            ...page,
            items: page.items.map(item => {
              const reviewedText = typeof saved[item.key] === 'string' ? saved[item.key] : item.text
              return {
                ...item,
                text: reviewedText,
                modified: reviewedText !== item.text,
                originalText: item.text
              }
            })
          }
        })
      }

      function exportReviewedTexts () {
        const exportedPages = createReviewedExport()
        const source = `window.QUESTIONNAIRE_TEXTS = ${JSON.stringify(exportedPages, null, 2)}\n`
        const blob = new Blob([source], { type: 'text/javascript;charset=utf-8' })
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        const now = new Date()
        const timestamp = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, '0'),
          String(now.getDate()).padStart(2, '0'),
          '-',
          String(now.getHours()).padStart(2, '0'),
          String(now.getMinutes()).padStart(2, '0'),
          String(now.getSeconds()).padStart(2, '0')
        ].join('')
        const savedPageCount = baselinePages.filter(page => pageHasSavedChanges(page)).length
        const fileName = `zh-questionnaire-text.reviewed-${savedPageCount}pages-${timestamp}.js`
        link.href = url
        link.download = fileName
        document.body.append(link)
        link.click()
        link.remove()
        URL.revokeObjectURL(url)

        const hasDrafts = reviewDrafts.size > 0
        elements.reviewStatus.textContent = hasDrafts
          ? `已导出 ${fileName}；包含 ${savedPageCount} 个已保存页面，未保存修改不会写入文件`
          : `已导出 ${fileName}；完整保留 20 页结构，其中 ${savedPageCount} 页包含修改`
      }

      function selectLanguage (language, announce) {
        currentLanguage = language
        writeStorage(LANGUAGE_STORAGE_KEY, currentLanguage)
        renderLanguage()

        if (announce) {
          document.dispatchEvent(new CustomEvent('languagechange', {
            detail: { language: currentLanguage, label: languageLabels[currentLanguage] }
          }))
        }
      }

      function goToPage (pageIndex) {
        if (pageIndex < 0 || pageIndex >= pageNames.length || pageIndex === currentPage) return
        currentPage = pageIndex
        writeStorage(PAGE_STORAGE_KEY, currentPage)
        renderPage()
      }

      function preloadAdjacentImage (pageIndex) {
        if (pageIndex < 0 || pageIndex >= pageNames.length) return
        const image = new Image()
        image.src = imagePath(SCREENSHOT_LANGUAGE, pageIndex)
      }

      languageButtons.forEach((button, index) => {
        button.addEventListener('click', function () {
          selectLanguage(button.dataset.language, true)
        })

        button.addEventListener('keydown', function (event) {
          let nextIndex = index
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') nextIndex = (index + 1) % languageButtons.length
          else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') nextIndex = (index - 1 + languageButtons.length) % languageButtons.length
          else if (event.key === 'Home') nextIndex = 0
          else if (event.key === 'End') nextIndex = languageButtons.length - 1
          else return

          event.preventDefault()
          selectLanguage(languageButtons[nextIndex].dataset.language, true)
          languageButtons[nextIndex].focus()
        })
      })

      elements.previous.addEventListener('click', function () { goToPage(currentPage - 1) })
      elements.next.addEventListener('click', function () { goToPage(currentPage + 1) })
      elements.saveReview.addEventListener('click', saveCurrentReview)
      elements.resetReview.addEventListener('click', resetCurrentReview)
      elements.exportReviews.addEventListener('click', exportReviewedTexts)
      elements.image.addEventListener('load', function () { elements.image.classList.remove('is-loading') })
      elements.image.addEventListener('error', function () {
        elements.image.classList.remove('is-loading')
        elements.status.textContent = `中文第 ${currentPage + 1} 页截图加载失败`
      })

      renderLanguage()
      renderPage()
    })()
  </script>
</body>
</html>
