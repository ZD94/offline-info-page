<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="无需服务器即可使用的离线信息展示与编辑页面">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23176b4d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='white'%3E%E6%A1%A3%3C/text%3E%3C/svg%3E">
  <title>信息协作页</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #65716a;
      --line: #dce4de;
      --paper: #fffdf8;
      --surface: #f4f6f0;
      --brand: #176b4d;
      --brand-dark: #0e5038;
      --accent: #f2b84b;
      --danger: #a6372d;
      --shadow: 0 18px 50px rgba(38, 57, 46, .12);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(242, 184, 75, .22), transparent 30rem),
        linear-gradient(135deg, #eef4ed 0%, #f8f4e8 100%);
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      color: white;
      background: var(--brand);
      box-shadow: 0 8px 20px rgba(23, 107, 77, .25);
    }

    .local-badge {
      padding: 7px 11px;
      border: 1px solid rgba(23, 107, 77, .2);
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(255, 255, 255, .65);
      font-size: 13px;
      font-weight: 700;
    }

    .hero, .panel {
      border: 1px solid rgba(220, 228, 222, .9);
      border-radius: 24px;
      background: rgba(255, 253, 248, .92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      padding: clamp(28px, 5vw, 54px);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -100px;
      width: 280px;
      height: 280px;
      border-radius: 48% 52% 62% 38%;
      background: rgba(23, 107, 77, .08);
      transform: rotate(18deg);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(34px, 6vw, 66px);
      line-height: 1.04;
      letter-spacing: -.045em;
    }

    .summary {
      max-width: 720px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .hero-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      min-width: 180px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      color: #15553f;
      background: #e2f2e9;
      font-size: 14px;
      font-weight: 800;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2d9b6b;
    }

    .updated {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    .button {
      min-height: 42px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, .9);
      font-weight: 750;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .button:hover { transform: translateY(-1px); border-color: #afbeb4; }
    .button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(242, 184, 75, .48);
      outline-offset: 2px;
    }

    .button.primary { color: white; border-color: var(--brand); background: var(--brand); }
    .button.primary:hover { background: var(--brand-dark); }
    .button.danger { color: var(--danger); }
    .button[hidden] { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .info-card {
      min-height: 180px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(38, 57, 46, .07);
    }

    .card-number {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin-bottom: 20px;
      border-radius: 10px;
      color: var(--brand-dark);
      background: #e6f0e9;
      font-size: 13px;
      font-weight: 900;
    }

    .info-card h2 { margin: 0 0 10px; font-size: 21px; }
    .info-card p { margin: 0; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }

    .empty {
      grid-column: 1 / -1;
      padding: 42px;
      border: 1px dashed #b9c6bd;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .45);
    }

    .panel { padding: clamp(22px, 4vw, 36px); }
    .panel[hidden] { display: none; }
    .panel h2 { margin: 0 0 8px; }
    .panel-intro { margin: 0 0 24px; color: var(--muted); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 14px; font-weight: 800; }

    input, textarea, select {
      width: 100%;
      border: 1px solid #cbd6ce;
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      padding: 11px 12px;
    }

    textarea { min-height: 96px; resize: vertical; line-height: 1.6; }

    .editor-list { display: grid; gap: 12px; margin-top: 24px; }
    .editor-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr auto;
      gap: 10px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid #e0c2bd;
      border-radius: 11px;
      color: var(--danger);
      background: #fff8f6;
      font-weight: 900;
    }

    .editor-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    .notice {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid #d8dfd2;
      border-radius: 14px;
      color: #526058;
      background: rgba(244, 246, 240, .78);
      font-size: 14px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 10;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      background: #17211b;
      box-shadow: var(--shadow);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 20px, 1120px); padding-top: 14px; }
      .topbar, footer { align-items: flex-start; flex-direction: column; }
      .hero { grid-template-columns: 1fr; }
      .hero-meta { align-items: flex-start; min-width: 0; }
      .updated { text-align: left; }
      .grid, .form-grid { grid-template-columns: 1fr; }
      .editor-row { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .icon-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">档</span><span>信息协作页</span></div>
      <span class="local-badge">离线可用 · 数据保存在本机</span>
    </header>

    <section id="viewer" aria-label="信息展示">
      <div class="hero">
        <div>
          <p class="eyebrow">Shared information</p>
          <h1 id="viewTitle"></h1>
          <p id="viewSummary" class="summary"></p>
        </div>
        <div class="hero-meta">
          <span id="viewStatus" class="status"></span>
          <div>
            <div id="viewContact" class="updated"></div>
            <div id="viewUpdated" class="updated"></div>
          </div>
        </div>
      </div>

      <div class="toolbar" aria-label="页面操作">
        <button id="editButton" class="button primary" type="button">编辑信息</button>
        <button id="exportButton" class="button" type="button">导出 JSON</button>
        <button id="importButton" class="button" type="button">导入 JSON</button>
        <button id="resetButton" class="button danger" type="button">恢复示例</button>
        <input id="fileInput" type="file" accept="application/json,.json" hidden>
      </div>

      <div id="cardGrid" class="grid" aria-live="polite"></div>
    </section>

    <section id="editor" class="panel" aria-label="信息编辑" hidden>
      <h2>编辑页面内容</h2>
      <p class="panel-intro">保存后内容会写入当前浏览器。若要发给其他人，请再导出 JSON 文件。</p>

      <form id="editForm">
        <div class="form-grid">
          <div class="field">
            <label for="titleInput">页面标题</label>
            <input id="titleInput" maxlength="80" required>
          </div>
          <div class="field">
            <label for="statusInput">状态</label>
            <select id="statusInput">
              <option>进行中</option>
              <option>待确认</option>
              <option>已完成</option>
              <option>已归档</option>
            </select>
          </div>
          <div class="field full">
            <label for="summaryInput">简介</label>
            <textarea id="summaryInput" maxlength="500"></textarea>
          </div>
          <div class="field full">
            <label for="contactInput">联系人或说明</label>
            <input id="contactInput" maxlength="120" placeholder="例如：联系人：张三 / example@company.com">
          </div>
        </div>

        <div id="editorList" class="editor-list"></div>
        <div class="editor-actions">
          <button id="addItemButton" class="button" type="button">＋ 添加信息项</button>
          <button class="button primary" type="submit">保存修改</button>
          <button id="cancelButton" class="button" type="button">取消</button>
        </div>
      </form>
      <div class="notice">隐私提示：不要填写密码、身份证号等敏感信息。此页面没有账号系统，也不会自动把数据同步给其他人。</div>
    </section>

    <footer>
      <span>无需安装 · 无需数据库 · 可直接分发 HTML 文件</span>
      <span id="storageState">正在检查本地保存能力…</span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict'

      const STORAGE_KEY = 'offline-info-page:v1'
      const sampleData = {
        schemaVersion: 1,
        title: '离线信息展示与协作',
        summary: '这是一个不依赖服务器和数据库的最小可用页面。你可以展示项目说明、进度或交付信息，也可以在浏览器中编辑并保存。',
        status: '进行中',
        contact: '联系人：请替换为真实联系方式',
        updatedAt: '',
        items: [
          { title: '使用方式', content: '将整个 index.html 文件发给外部人员，对方双击即可使用。' },
          { title: '本地编辑', content: '点击“编辑信息”，修改后点击“保存修改”，数据将保存在当前浏览器。' },
          { title: '传递修改', content: '点击“导出 JSON”生成数据文件；其他人通过“导入 JSON”即可载入相同内容。' },
          { title: '适用范围', content: '适合无账号、无多人实时协作要求的资料展示、清单和简单记录。' }
        ]
      }

      const elements = {
        viewer: document.querySelector('#viewer'),
        editor: document.querySelector('#editor'),
        viewTitle: document.querySelector('#viewTitle'),
        viewSummary: document.querySelector('#viewSummary'),
        viewStatus: document.querySelector('#viewStatus'),
        viewContact: document.querySelector('#viewContact'),
        viewUpdated: document.querySelector('#viewUpdated'),
        cardGrid: document.querySelector('#cardGrid'),
        editButton: document.querySelector('#editButton'),
        exportButton: document.querySelector('#exportButton'),
        importButton: document.querySelector('#importButton'),
        resetButton: document.querySelector('#resetButton'),
        fileInput: document.querySelector('#fileInput'),
        editForm: document.querySelector('#editForm'),
        titleInput: document.querySelector('#titleInput'),
        statusInput: document.querySelector('#statusInput'),
        summaryInput: document.querySelector('#summaryInput'),
        contactInput: document.querySelector('#contactInput'),
        editorList: document.querySelector('#editorList'),
        addItemButton: document.querySelector('#addItemButton'),
        cancelButton: document.querySelector('#cancelButton'),
        storageState: document.querySelector('#storageState'),
        toast: document.querySelector('#toast')
      }

      let data = loadData()
      let toastTimer

      function clone (value) {
        return JSON.parse(JSON.stringify(value))
      }

      function normalizeData (value) {
        if (!value || typeof value !== 'object') throw new Error('JSON 内容不是有效对象')
        const items = Array.isArray(value.items) ? value.items : []
        return {
          schemaVersion: 1,
          title: String(value.title || '未命名页面').slice(0, 80),
          summary: String(value.summary || '').slice(0, 500),
          status: String(value.status || '待确认').slice(0, 30),
          contact: String(value.contact || '').slice(0, 120),
          updatedAt: String(value.updatedAt || ''),
          items: items.slice(0, 100).map(item => ({
            title: String(item && item.title ? item.title : '未命名信息').slice(0, 100),
            content: String(item && item.content ? item.content : '').slice(0, 2000)
          }))
        }
      }

      function loadData () {
        try {
          const saved = localStorage.getItem(STORAGE_KEY)
          elements.storageState.textContent = '本地保存可用'
          return saved ? normalizeData(JSON.parse(saved)) : clone(sampleData)
        } catch (error) {
          elements.storageState.textContent = '本地保存不可用，请使用导出 JSON'
          return clone(sampleData)
        }
      }

      function persistData () {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data))
          elements.storageState.textContent = '本地保存可用'
          return true
        } catch (error) {
          elements.storageState.textContent = '本地保存失败，请导出 JSON 留档'
          return false
        }
      }

      function textElement (tag, className, text) {
        const element = document.createElement(tag)
        if (className) element.className = className
        element.textContent = text
        return element
      }

      function renderViewer () {
        elements.viewTitle.textContent = data.title
        elements.viewSummary.textContent = data.summary || '暂无简介'
        elements.viewStatus.textContent = data.status
        elements.viewContact.textContent = data.contact || '未填写联系人'
        elements.viewUpdated.textContent = data.updatedAt ? `最后保存：${formatDate(data.updatedAt)}` : '尚未保存修改'
        elements.cardGrid.replaceChildren()

        if (data.items.length === 0) {
          elements.cardGrid.append(textElement('div', 'empty', '暂无信息项，点击“编辑信息”添加。'))
          return
        }

        data.items.forEach((item, index) => {
          const card = document.createElement('article')
          card.className = 'info-card'
          card.append(textElement('span', 'card-number', String(index + 1).padStart(2, '0')))
          card.append(textElement('h2', '', item.title))
          card.append(textElement('p', '', item.content || '暂无内容'))
          elements.cardGrid.append(card)
        })
      }

      function formatDate (value) {
        const date = new Date(value)
        return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }).format(date)
      }

      function openEditor () {
        elements.titleInput.value = data.title
        elements.statusInput.value = Array.from(elements.statusInput.options).some(option => option.value === data.status) ? data.status : '待确认'
        elements.summaryInput.value = data.summary
        elements.contactInput.value = data.contact
        renderEditorItems(data.items)
        elements.viewer.hidden = true
        elements.editor.hidden = false
        elements.titleInput.focus()
      }

      function closeEditor () {
        elements.editor.hidden = true
        elements.viewer.hidden = false
        elements.editButton.focus()
      }

      function renderEditorItems (items) {
        elements.editorList.replaceChildren()
        items.forEach(item => appendEditorRow(item))
      }

      function appendEditorRow (item = { title: '', content: '' }) {
        const row = document.createElement('div')
        row.className = 'editor-row'

        const title = document.createElement('input')
        title.className = 'item-title'
        title.value = item.title
        title.maxLength = 100
        title.placeholder = '信息标题'
        title.setAttribute('aria-label', '信息标题')

        const content = document.createElement('textarea')
        content.className = 'item-content'
        content.value = item.content
        content.maxLength = 2000
        content.placeholder = '信息内容'
        content.setAttribute('aria-label', '信息内容')

        const remove = document.createElement('button')
        remove.className = 'icon-button'
        remove.type = 'button'
        remove.textContent = '删除'
        remove.setAttribute('aria-label', '删除该信息项')
        remove.addEventListener('click', function () { row.remove() })

        row.append(title, content, remove)
        elements.editorList.append(row)
        return row
      }

      function collectEditorItems () {
        return Array.from(elements.editorList.querySelectorAll('.editor-row')).map(row => ({
          title: row.querySelector('.item-title').value.trim() || '未命名信息',
          content: row.querySelector('.item-content').value.trim()
        }))
      }

      function saveEditor (event) {
        event.preventDefault()
        data = normalizeData({
          title: elements.titleInput.value.trim(),
          summary: elements.summaryInput.value.trim(),
          status: elements.statusInput.value,
          contact: elements.contactInput.value.trim(),
          updatedAt: new Date().toISOString(),
          items: collectEditorItems()
        })
        const saved = persistData()
        renderViewer()
        closeEditor()
        showToast(saved ? '修改已保存在当前浏览器' : '浏览器保存失败，请导出 JSON 留档')
      }

      function exportJson () {
        const payload = JSON.stringify(data, null, 2)
        const blob = new Blob([payload], { type: 'application/json;charset=utf-8' })
        const url = URL.createObjectURL(blob)
        const anchor = document.createElement('a')
        anchor.href = url
        anchor.download = `信息协作页-${new Date().toISOString().slice(0, 10)}.json`
        document.body.append(anchor)
        anchor.click()
        anchor.remove()
        URL.revokeObjectURL(url)
        showToast('JSON 已导出，可发送给其他人')
      }

      async function importJson (file) {
        if (!file) return
        try {
          const imported = normalizeData(JSON.parse(await file.text()))
          data = imported
          data.updatedAt = new Date().toISOString()
          persistData()
          renderViewer()
          showToast('JSON 已导入')
        } catch (error) {
          showToast(`导入失败：${error.message}`)
        } finally {
          elements.fileInput.value = ''
        }
      }

      function resetData () {
        if (!window.confirm('确定恢复示例内容吗？当前浏览器中保存的修改将被替换。')) return
        data = clone(sampleData)
        data.updatedAt = new Date().toISOString()
        persistData()
        renderViewer()
        showToast('已恢复示例内容')
      }

      function showToast (message) {
        window.clearTimeout(toastTimer)
        elements.toast.textContent = message
        elements.toast.classList.add('show')
        toastTimer = window.setTimeout(function () { elements.toast.classList.remove('show') }, 2600)
      }

      elements.editButton.addEventListener('click', openEditor)
      elements.cancelButton.addEventListener('click', closeEditor)
      elements.editForm.addEventListener('submit', saveEditor)
      elements.addItemButton.addEventListener('click', function () {
        const row = appendEditorRow()
        row.querySelector('.item-title').focus()
      })
      elements.exportButton.addEventListener('click', exportJson)
      elements.importButton.addEventListener('click', function () { elements.fileInput.click() })
      elements.fileInput.addEventListener('change', function () { importJson(elements.fileInput.files[0]) })
      elements.resetButton.addEventListener('click', resetData)

      renderViewer()
    })()
  </script>
</body>
</html>
